name: Check

on:
  pull_request:

jobs:
  check:
    name: Skills in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check skills are in sync
        run: python3 scripts/sync_skills.py --check
